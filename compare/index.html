<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REX Growth & Income 比較</title>
<style>
body{font-family:system-ui,sans-serif;max-width:1100px;margin:auto;padding:24px;background:#fafafa;color:#171717}h1{margin-bottom:4px}.note{background:#fff4d6;padding:12px;border-radius:8px}.status{background:white;border:1px solid #ddd;border-radius:8px;padding:12px;margin:12px 0}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.control{display:grid;gap:6px;min-width:140px}.control label{font-weight:600}select{font:inherit;padding:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:16px}.metric{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid #eee;padding:8px 0}.history{font-variant-numeric:tabular-nums}.source{display:inline-block;margin-top:12px}.cta{margin-top:24px;background:white;border:1px solid #ddd;border-radius:12px;padding:16px}.cta a{display:inline-block;padding:10px 14px;border:1px solid #171717;border-radius:8px;color:#171717;text-decoration:none;font-weight:600}@media(max-width:700px){body{padding:16px}.grid{grid-template-columns:1fr}.controls{display:grid;grid-template-columns:1fr 1fr}.control{min-width:0}.metric{align-items:baseline}}
</style>
</head>
<body>
<h1>REX Growth & Income 比較</h1>
<p>現行の NVII / TSII / WMTI から2本を比較します。</p>
<p class="note">Distribution Rate は直近の分配を年率換算した指標で、total return ではありません。公式観測値とモデル出力は混在させません。</p>
<p id="observation-status" class="status" role="status" aria-live="polite">公式観測データを読み込んでいます。</p>
<div class="controls" aria-label="比較対象">
  <div class="control"><label for="left">比較1</label><select id="left"></select></div>
  <div class="control"><label for="right">比較2</label><select id="right"></select></div>
</div>
<div id="result" class="grid" aria-live="polite"></div>
<section class="cta" aria-labelledby="alert-demand-heading">
<h2 id="alert-demand-heading">週次アラートが必要ですか？</h2>
<p>継続利用需要を推測せず、実際に送信された要望だけを記録します。希望する比較対象や通知内容を GitHub Issue で送ってください。</p>
<a href="https://github.com/KAFKA2306/NVII/issues/new?title=REX%20Growth%20%26%20Income%20%E9%80%B1%E6%AC%A1%E3%82%A2%E3%83%A9%E3%83%BC%E3%83%88%E5%B8%8C%E6%9C%9B&amp;body=%E6%AF%94%E8%BC%83%E3%81%97%E3%81%9F%E3%81%84fund%3A%20%0A%E9%80%9A%E7%9F%A5%E3%81%A7%E8%A6%8B%E3%81%9F%E3%81%84%E5%A4%89%E5%8C%96%3A%20%0A%E5%B8%8C%E6%9C%9B%E9%A0%BB%E5%BA%A6%3A%20" target="_blank" rel="noopener">週次アラートを希望する ↗</a>
</section>
<script>
const money=v=>v==null?'—':`$${Number(v).toFixed(2)}`;const pct=v=>v==null?'—':`${Number(v).toFixed(2)}%`;
let observations,distributions;
function renderObservationStatus(){const observed=new Date(observations.observed_at);if(Number.isNaN(observed.getTime())){document.getElementById('observation-status').textContent='観測日時を確認できません。現在値として扱わないでください。';return;}const days=Math.max(0,Math.floor((Date.now()-observed.getTime())/86400000));const date=new Intl.DateTimeFormat('ja-JP',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Tokyo'}).format(observed);document.getElementById('observation-status').textContent=`公式観測: ${date}（${days}日前）。この画面は現在値ではなく、観測日時点の比較です。`;}
async function load(){[observations,distributions]=await Promise.all([fetch('../data/rex-growth-income-active-observations.json').then(r=>{if(!r.ok)throw new Error(`observations ${r.status}`);return r.json()}),fetch('../data/rex-growth-income-distributions.json').then(r=>{if(!r.ok)throw new Error(`distributions ${r.status}`);return r.json()})]);renderObservationStatus();const tickers=observations.funds.map(f=>f.ticker);for(const id of ['left','right']){const el=document.getElementById(id);tickers.forEach(t=>el.add(new Option(t,t)));el.addEventListener('change',render);}document.getElementById('right').selectedIndex=1;render();}
function card(ticker){const f=observations.funds.find(x=>x.ticker===ticker),h=distributions.funds.find(x=>x.ticker===ticker);const o=f.observation,d=f.distribution;const rows=h.distributions.map(x=>`<div class="metric history"><span>${x.declaration_date}</span><strong>${money(x.distribution_per_share_usd)}</strong></div>`).join('');return `<section class="card"><h2>${ticker}</h2><div class="metric"><span>NAV (${o.as_of})</span><strong>${money(o.nav_usd)}</strong></div><div class="metric"><span>Market price</span><strong>${money(o.market_price_usd)}</strong></div><div class="metric"><span>Premium / discount</span><strong>${pct(o.premium_discount_percent)}</strong></div><div class="metric"><span>Distribution Rate (${d.as_of})</span><strong>${pct(d.distribution_rate_percent)}</strong></div><div class="metric"><span>30-Day SEC Yield (${d.sec_yield_as_of})</span><strong>${pct(d.sec_yield_percent)}</strong></div><div class="metric"><span>Estimated ROC</span><strong>${pct(d.estimated_roc_percent)}</strong></div><div class="metric"><span>Total expense ratio</span><strong>${pct(o.total_expense_ratio_percent)}</strong></div><div class="metric"><span>Holdings / net weight</span><strong>${o.number_of_holdings} / ${pct(f.holdings.net_weight_sum_percent)}</strong></div><h3>直近12週の1口当たり分配</h3>${rows}<a class="source" href="${f.source_url}" target="_blank" rel="noopener">REX公式一次情報 ↗</a></section>`;}
function render(){const a=document.getElementById('left').value,b=document.getElementById('right').value;document.getElementById('result').innerHTML=a===b?'<p>異なる2本を選択してください。</p>':card(a)+card(b);}
load().catch(e=>{document.getElementById('observation-status').textContent='公式観測データを読み込めませんでした。';document.getElementById('result').textContent='比較できません。時間をおいて再読み込みしてください。';console.error(e)});
</script>
</body></html>
