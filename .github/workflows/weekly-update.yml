name: NVII Weekly Dashboard Update

on:
  schedule:
    - cron: '0 9 * * MON'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if markets are closed'
        required: false
        default: 'false'
        type: boolean
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

env:
  PYTHON_VERSION: '3.10'
  TZ: 'America/New_York'

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Create required directories
      run: |
        mkdir -p logs dashboard docs
        chmod 755 scripts/*.py
    - name: Check market hours (weekdays only)
      id: market_check
      run: |
        current_day=$(date +%u)
        force_update="${{ github.event.inputs.force_update }}"
        if [[ $current_day -le 5 ]] || [[ "$force_update" == "true" ]]; then
          echo "market_open=true" >> $GITHUB_OUTPUT
          echo "Proceeding with update"
        else
          echo "market_open=false" >> $GITHUB_OUTPUT
          echo "Skipping update"
        fi
    - name: Run REX Family Integrated Analysis
      if: steps.market_check.outputs.market_open == 'true'
      run: |
        export PYTHONUNBUFFERED=1
        python3 scripts/unified_rex_system_english.py
        python3 scripts/weekly_update.py
    - name: Verify generated files
      if: steps.market_check.outputs.market_open == 'true'
      run: |
        required_files=(
          "dashboard/index.html"
          "docs/nvii_nvda_returns_comparison.md"
          "docs/nvii_nvda_summary_stats.csv"
          "docs/nvii_nvda_performance_chart.png"
          "docs/rex_family_vs_underlying_analysis.csv"
          "docs/rex_family_comprehensive_dashboard_english.png"
          "docs/rex_family_comprehensive_report_english.md"
          "docs/rex_analysis_metadata_english.json"
          "docs/nvii_detailed_analysis.csv"
          "docs/nvda_underlying_analysis.csv"
        )
        for file in "${required_files[@]}"; do
          test -f "$file"
        done
    - name: Generate update metadata
      if: steps.market_check.outputs.market_open == 'true'
      run: |
        cat > docs/update_info.json << EOF
        {
          "last_update": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
          "update_type": "automated",
          "workflow_run": "${{ github.run_number }}",
          "commit_sha": "${{ github.sha }}",
          "market_status": "open"
        }
        EOF
    - name: Commit and push changes
      if: steps.market_check.outputs.market_open == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "data: weekly REX dashboard update $(date +"%Y-%m-%d")"
          git push
        fi
    - name: Upload dashboard artifact
      if: steps.market_check.outputs.market_open == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: nvii-dashboard-${{ github.run_number }}
        path: |
          dashboard/
          docs/
        retention-days: 30
    - name: Create release on major updates
      if: steps.market_check.outputs.market_open == 'true' && github.event_name == 'schedule'
      run: |
        week_number=$(date +"%Y-W%U")
        release_tag="weekly-${week_number}"
        if git tag -l "$release_tag" | grep -q "$release_tag"; then
          echo "Release $release_tag already exists"
        else
          git tag -a "$release_tag" -m "Weekly Dashboard Release - Week $(date +"%U"), $(date +"%Y")"
          git push origin "$release_tag"
        fi

  deploy-pages:
    needs: update-dashboard
    if: needs.update-dashboard.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main
    - name: Setup Pages
      uses: actions/configure-pages@v4
    - name: Assemble Pages site
      run: |
        rm -rf _site
        mkdir -p _site/data
        cp -R dashboard/. _site/
        cp -R compare _site/compare
        cp data/rex-growth-income-active-observations.json _site/data/
        cp data/rex-growth-income-distributions.json _site/data/
        python - <<'PY'
        import json
        from pathlib import Path
        observations = json.loads(Path('_site/data/rex-growth-income-active-observations.json').read_text())
        distributions = json.loads(Path('_site/data/rex-growth-income-distributions.json').read_text())
        assert {fund['ticker'] for fund in observations['funds']} == {'NVII', 'TSII', 'WMTI'}
        assert {fund['ticker'] for fund in distributions['funds']} == {'NVII', 'TSII', 'WMTI'}
        assert sum(len(fund['distributions']) for fund in distributions['funds']) >= 36
        assert Path('_site/compare/index.html').is_file()
        PY
    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./_site
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
    - name: Verify deployed compare page
      env:
        PAGE_URL: ${{ steps.deployment.outputs.page_url }}
      run: |
        for attempt in 1 2 3 4 5 6; do
          if curl --fail --silent --show-error --location "${PAGE_URL}compare/" -o /tmp/compare.html && \
             curl --fail --silent --show-error --location "${PAGE_URL}data/rex-growth-income-active-observations.json" -o /tmp/observations.json && \
             curl --fail --silent --show-error --location "${PAGE_URL}data/rex-growth-income-distributions.json" -o /tmp/distributions.json; then
            break
          fi
          if [ "$attempt" -eq 6 ]; then
            exit 1
          fi
          sleep 10
        done
        grep -q 'REX Growth & Income 比較' /tmp/compare.html
        python - <<'PY'
        import json
        from pathlib import Path
        observations = json.loads(Path('/tmp/observations.json').read_text())
        distributions = json.loads(Path('/tmp/distributions.json').read_text())
        assert {fund['ticker'] for fund in observations['funds']} == {'NVII', 'TSII', 'WMTI'}
        assert {fund['ticker'] for fund in distributions['funds']} == {'NVII', 'TSII', 'WMTI'}
        assert sum(len(fund['distributions']) for fund in distributions['funds']) >= 36
        PY
        echo "Verified ${PAGE_URL}compare/"

  notify-failure:
    needs: [update-dashboard, deploy-pages]
    runs-on: ubuntu-latest
    if: failure()
    steps:
    - name: Create failure issue
      uses: actions/github-script@v7
      with:
        script: |
          const title = `NVII Dashboard Update Failed - ${new Date().toISOString().split('T')[0]}`;
          const body = `Workflow run #${{ github.run_number }} failed. Check ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.`;
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title,
            body,
            labels: ['bug', 'automation', 'dashboard']
          });
