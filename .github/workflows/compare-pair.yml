name: REX Compare Pair Contract

on:
  pull_request:
    paths:
      - 'scripts/validate_rex_compare_pair.py'
      - 'tests/**'
      - 'compare/**'
      - 'data/rex-growth-income-active-observations.json'
      - 'data/rex-growth-income-distributions.json'
      - '.github/workflows/compare-pair.yml'
      - '.github/workflows/weekly-update.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
      - name: Validate canonical comparison pair
        run: python scripts/validate_rex_compare_pair.py
