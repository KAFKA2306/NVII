name: REX fund data integrity

on:
  pull_request:
    paths:
      - 'data/rex-growth-income-funds.json'
      - 'data/rex-growth-income-active-observations.json'
      - 'data/rex-growth-income-distributions.json'
      - 'compare/**'
      - 'scripts/validate_rex_fund_master.py'
      - 'scripts/validate_rex_active_observations.py'
      - 'scripts/validate_rex_distributions.py'
      - 'tests/test_rex_fund_master.py'
      - 'tests/test_rex_active_observations.py'
      - 'tests/test_rex_distributions.py'
      - 'tests/test_rex_compare_page.py'
      - '.github/workflows/rex-fund-master.yml'
      - '.github/workflows/weekly-update.yml'
  push:
    branches: [main]
    paths:
      - 'data/rex-growth-income-funds.json'
      - 'data/rex-growth-income-active-observations.json'
      - 'data/rex-growth-income-distributions.json'
      - 'compare/**'
      - 'scripts/validate_rex_fund_master.py'
      - 'scripts/validate_rex_active_observations.py'
      - 'scripts/validate_rex_distributions.py'
      - 'tests/test_rex_fund_master.py'
      - 'tests/test_rex_active_observations.py'
      - 'tests/test_rex_distributions.py'
      - 'tests/test_rex_compare_page.py'
      - '.github/workflows/rex-fund-master.yml'
      - '.github/workflows/weekly-update.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile validators and tests
        run: |
          python -m py_compile scripts/validate_rex_fund_master.py tests/test_rex_fund_master.py
          python -m py_compile scripts/validate_rex_active_observations.py tests/test_rex_active_observations.py
          python -m py_compile scripts/validate_rex_distributions.py tests/test_rex_distributions.py
          python -m py_compile tests/test_rex_compare_page.py
      - name: Run data and compare-page contract tests
        run: python -m unittest tests.test_rex_fund_master tests.test_rex_active_observations tests.test_rex_distributions tests.test_rex_compare_page -v
      - name: Validate repository datasets
        run: |
          python scripts/validate_rex_fund_master.py
          python scripts/validate_rex_active_observations.py
          python scripts/validate_rex_distributions.py
      - name: Clean runtime caches
        run: find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Require clean checkout
        run: test -z "$(git status --porcelain --untracked-files=all)"
